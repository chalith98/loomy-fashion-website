<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Loomy Fashion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-body">

    <!-- Back to Home Floating Button -->
    <a href="index.html" class="back-home-btn">
        <i class="fas fa-arrow-left"></i> <span>Back to Shop</span>
    </a>

    <!-- Split Screen Login Wrapper -->
    <div class="auth-split-container">

        <!-- Left Visual Side -->
        <!-- Left Visual Side with Fashion Poster Image -->
        <div class="auth-banner-side">
            <!-- Background Image Container -->
            <div class="poster-bg-image"></div>

            <div class="banner-overlay"></div>

            <div class="banner-content">
                <div class="brand-badge">
                    <img src="image/logo.jpeg" alt="Loomy Fashion Logo">
                </div>
                <h1>Redefine Your <span>Style</span></h1>
                <p>Cute | Casual | Comfortabale.
                </p>
                <div class="banner-features">
                    <div class="b-feat"><i class="fas fa-truck-fast"></i> Express Delivery</div>
                    <div class="b-feat"><i class="fas fa-shirt"></i> Custom Prints</div>
                    <div class="b-feat"><i class="fas fa-shield-heart"></i> Premium Cotton</div>
                </div>
            </div>

            <!-- Subtle Glow Effect -->
            <div class="floating-blob blob-a"></div>
        </div>

        <!-- Right Form Side -->
        <div class="auth-form-side">
            <div class="auth-card-box">

                <div class="auth-header">
                    <h2>Welcome to <span>Loomy</span></h2>
                    <p>Please enter your details to access your account</p>
                </div>

                <!-- Animated Pill Tab Switcher -->
                <div class="tab-box">
                    <div class="tab-indicator" id="tab-indicator"></div>
                    <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
                    <button class="tab-btn" onclick="switchTab('register')">Register</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="login-form" class="auth-form active-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" required id="login-email" placeholder="Email Address">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" required id="login-password" placeholder="Password">
                        <i class="fas fa-eye toggle-pwd" onclick="togglePasswordVisibility('login-password', this)"></i>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> <span>Remember Me</span>
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span>Sign In</span> <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" required id="reg-name" placeholder="Full Name">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" required id="reg-email" placeholder="Email Address">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" required id="reg-password" placeholder="Password">
                        <i class="fas fa-eye toggle-pwd" onclick="togglePasswordVisibility('reg-password', this)"></i>
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        <span>Create Account</span> <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <!-- Social Authentication Options -->
                <div class="social-divider">
                    <span>Or quick connect with</span>
                </div>

                <div class="social-auth-btns">
                    <button type="button" class="social-btn google-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
